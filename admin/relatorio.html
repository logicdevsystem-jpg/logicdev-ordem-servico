<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Relatório da Ordem de Serviço — LogicDev SYSTEM
  </title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

</head>


<body>

<div class="pagina">


  <div class="topo">

    <div class="marca">

      <img
        src="../assets/logo-logicdev.jpeg"
        alt="LogicDev"
      >

      <span class="nome">
        LogicDev
        <span>SYSTEM</span>
      </span>

    </div>


    <div class="topo-usuario">

      <div>
        <strong id="nome-admin">
          —
        </strong>
      </div>


      <a
        href="dashboard.html"
        class="sair"
      >
        ← Voltar
      </a>

    </div>

  </div>


  <div class="conteudo">


    <div class="cabecalho-secao">

      <div>

        <h2>
          Relatório da Ordem de Serviço
        </h2>

        <p>
          Pesquisa por nome ou CPF/CNPJ.
        </p>

      </div>

    </div>


    <div class="cartao nao-imprime">

      <label for="busca">
        Pesquisar cliente
      </label>


      <input
        type="text"
        id="busca"
        placeholder="Nome ou CPF/CNPJ do cliente"
      >


      <div
        id="resultados-busca"
        style="margin-top:10px;"
      >
      </div>

    </div>


    <div
      id="area-relatorio"
      style="margin-top:20px;"
    >
    </div>


  </div>


  <div class="rodape nao-imprime">

    © 2026 LogicDev SYSTEM -
    Todos os direitos reservados.

  </div>


</div>


<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>

<script src="../js/db.js"></script>

<script src="../js/admin.js"></script>


<script>

  exigirLoginAdmin(
    inicializarRelatorio
  );

</script>

</html>
